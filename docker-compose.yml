services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cvr
      POSTGRES_PASSWORD: cvr
      POSTGRES_DB: cvr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cvr" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://cvr:cvr@db:5432/cvr
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
